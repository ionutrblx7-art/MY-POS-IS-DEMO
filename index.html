<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style>
<title>POS Personal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: aplicație pe o coloană, bară de taburi jos, coșul se deschide pe tot ecranul */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --fg:#18231e; --muted:#5d6b64; --line:#dde3dd;
  --accent:#0e7a5c; --accent-fg:#ffffff; --soft:#e4efe9; --bad:#b3261e; --badsoft:#f8e6e4;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101713; --surface:#18211c; --fg:#e8eee9; --muted:#9aa8a0; --line:#2a352f;
    --accent:#3fbf96; --accent-fg:#06231a; --soft:#1d2d25; --bad:#f0857d; --badsoft:#3a1f1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101713; --surface:#18211c; --fg:#e8eee9; --muted:#9aa8a0; --line:#2a352f;
  --accent:#3fbf96; --accent-fg:#06231a; --soft:#1d2d25; --bad:#f0857d; --badsoft:#3a1f1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:15px/1.45 var(--font-body);
  padding-block:12px 160px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body.lock{overflow:hidden}
#main{max-width:640px;margin-inline:auto;min-width:0}
h1,h2{font-family:var(--font-display);margin:0;font-weight:700;letter-spacing:-.01em}
.h{font-size:24px;margin:6px 0 12px}
h2{font-size:17px}
small,.note{color:var(--muted)}
.note{font-size:13px;margin:8px 0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px;font-size:16px;
}
textarea{resize:vertical;font-size:13px}
.lbl,label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:12px 0 4px}
.btn{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;font-weight:500;min-height:44px;
}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.small{min-height:38px;padding:6px 10px;font-size:14px}
.btn.danger{background:var(--badsoft);color:var(--bad);border-color:var(--bad)}
.btn.big{width:100%;min-height:54px;font-size:17px;margin-top:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.empty{text-align:center;padding:40px 8px;color:var(--muted)}
.empty h2{color:var(--fg);margin-bottom:6px}
.empty .btn{margin-top:14px}

/* Vânzare */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{
  flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;min-height:40px;font-size:14px;
}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.prod{
  position:relative;min-width:0;min-height:92px;text-align:left;display:flex;flex-direction:column;
  justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:12px;
}
.prod:active{background:var(--soft)}
.pn{font-weight:500;overflow-wrap:anywhere}
.pp{font-family:var(--font-display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.badge{
  position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:12px;padding:0 7px;
  background:var(--accent);color:var(--accent-fg);font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}

/* Bară jos */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.dock-in{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.cartbtn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:12px 14px;min-height:50px;
  font-variant-numeric:tabular-nums;
}
.cartbtn strong{font-family:var(--font-display);font-size:18px}
.cartbtn .go{font-weight:600}
.cartrow{display:flex;gap:8px}
.cartrow .cartbtn{flex:1 1 auto;width:auto;min-width:0}
.quickcard{
  flex:0 0 auto;min-height:50px;padding:0 18px;border-radius:12px;font-weight:600;font-size:16px;
  background:var(--surface);color:var(--accent);border:2px solid var(--accent);
}
.quickcard:active{background:var(--soft)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.kpdisp{font-family:var(--font-display);font-weight:700;font-size:48px;text-align:right;padding:24px 8px 16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpdisp small{font-size:20px;color:var(--muted);font-weight:500}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{min-height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:26px;font-family:var(--font-display);font-weight:500}
.key:active{background:var(--soft)}
.kpacts .btn{flex:1;width:auto}
.kpcard{color:var(--accent);border:2px solid var(--accent)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{
  background:transparent;border:0;border-radius:10px;padding:6px 2px;min-height:48px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;
}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);background:var(--soft)}

/* Coș */
.sheet{
  position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sheet-in{max-width:640px;margin-inline:auto;padding-block:8px calc(28px + env(safe-area-inset-bottom,0px))}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lines{list-style:none;margin:8px 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.lines li:first-child{border-top:0}
.ln{min-width:0;display:flex;flex-direction:column}
.ln span{overflow-wrap:anywhere;font-weight:500}
.ln small{font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:8px}
.qty b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.rb{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
.lt{min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 12px}
.total strong{font-family:var(--font-display);font-size:32px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:12px;min-height:46px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.quick{margin-top:10px;margin-bottom:0}
.rest{display:flex;justify-content:space-between;align-items:baseline;border-radius:12px;padding:14px;margin-top:10px;font-weight:500}
.rest strong{font-family:var(--font-display);font-size:26px;font-variant-numeric:tabular-nums}
.rest.ok{background:var(--soft);color:var(--accent)}
.rest.bad{background:var(--badsoft);color:var(--bad)}

/* Produse */
.plist,.dlist{list-style:none;margin:12px 0;padding:0}
.prow{
  display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;
}
.prow>div:first-child{min-width:0;display:flex;flex-direction:column}
.prow b{overflow-wrap:anywhere}
.prow small{font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;flex:0 0 auto}
.err{color:var(--bad);font-size:14px;min-height:18px;margin-top:8px}

/* Rapoarte */
.pager{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:12px 0}
.pager .btn{padding:0;font-size:20px}
.pager .btn:disabled{opacity:.35}
.pager div{text-align:center;font-weight:500}
.pager div small{display:block}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .card{margin:0;padding:14px}
.kpi .wide{grid-column:1/-1}
.kpi small{display:block;font-size:13px}
.kpi strong{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.kpi .wide strong{font-size:34px;color:var(--accent)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.brow:first-of-type{border-top:0}
.brow span{overflow-wrap:anywhere}
.brow em{font-style:normal;color:var(--muted);font-size:13px}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* Istoric */
.day{font-size:14px;color:var(--muted);font-weight:500;font-family:var(--font-body);margin:20px 0 8px}
.sale{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.srow{
  width:100%;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:8px;align-items:center;
  background:transparent;border:0;padding:12px;min-height:50px;text-align:left;font-variant-numeric:tabular-nums;
}
.srow .t{color:var(--muted)}
.sdet{padding:0 12px 12px;border-top:1px solid var(--line)}
.sdet ul{list-style:none;margin:8px 0;padding:0}
.sdet li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-variant-numeric:tabular-nums}
.sdet li span:first-child{min-width:0;overflow-wrap:anywhere}

/* Mesaj */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:50;
  max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;
  font-weight:500;text-align:center;
}
@media (prefers-reduced-motion:no-preference){.prod,.btn{transition:background-color .12s}}
</style>

<main id="main" aria-live="polite"></main>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Coș" hidden></div>
<div id="kp" class="sheet" role="dialog" aria-modal="true" aria-label="Sumă liberă" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div class="dock">
  <div class="dock-in">
    <div id="cartbar" hidden></div>
    <nav class="nav" aria-label="Secțiuni">
      <button class="tab" data-a="tab" data-v="sell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.76L19.5 8H6"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>Vânzare</button>
      <button class="tab" data-a="tab" data-v="prod"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg>Produse</button>
      <button class="tab" data-a="tab" data-v="rep"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Rapoarte</button>
      <button class="tab" data-a="tab" data-v="hist"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Istoric</button>
    </nav>
  </div>
</div>

<script>
(function(){
'use strict';
var KEY='pos-personal-v1';
var $=function(s){return document.querySelector(s)};
var p2=function(n){return String(n).padStart(2,'0')};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
var money=function(b){return (b/100).toLocaleString('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2})+' lei'};
var plain=function(b){return (b/100).toFixed(2).replace('.',',')};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var sum=function(a,f){return a.reduce(function(t,x){return t+f(x)},0)};
function parseMoney(s){
  s=String(s).trim().replace(/\s/g,'').replace(',','.');
  var n=parseFloat(s);
  return (isFinite(n)&&n>=0&&/^\d*\.?\d*$/.test(s))?Math.round(n*100):null;
}
var dayKey=function(t){var d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
var monthKey=function(t){return dayKey(t).slice(0,7)};
var todayKey=function(){return dayKey(Date.now())};
var fmtDay=function(k){var a=k.split('-').map(Number);return cap(new Date(a[0],a[1]-1,a[2]).toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))};
var fmtShort=function(k){var a=k.split('-').map(Number);return cap(new Date(a[0],a[1]-1,a[2]).toLocaleDateString('ro-RO',{weekday:'short',day:'numeric'}))};
var fmtMonth=function(k){var a=k.split('-').map(Number);return cap(new Date(a[0],a[1]-1,1).toLocaleDateString('ro-RO',{month:'long',year:'numeric'}))};
var fmtTime=function(t){return new Date(t).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})};
function shiftDay(k,n){var a=k.split('-').map(Number);return dayKey(new Date(a[0],a[1]-1,a[2]+n).getTime())}
function shiftMonth(k,n){var a=k.split('-').map(Number);return monthKey(new Date(a[0],a[1]-1+n,1).getTime())}

/* ---------- Date ---------- */
var SEED=[
  {n:'Cafea',p:800,c:'Băuturi'},{n:'Apă plată 0,5 L',p:500,c:'Băuturi'},{n:'Suc',p:700,c:'Băuturi'},
  {n:'Covrig',p:300,c:'Mâncare'},{n:'Sandviș',p:1400,c:'Mâncare'},{n:'Prăjitură',p:1000,c:'Mâncare'}
];
var S={products:[],sales:[],seeded:false};
try{
  var raw=localStorage.getItem(KEY);
  if(raw){var o=JSON.parse(raw);if(o&&Array.isArray(o.products)&&Array.isArray(o.sales))S=o;}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
if(!S.seeded){
  S.products=SEED.map(function(x){return {id:uid(),name:x.n,price:x.p,cat:x.c}});
  S.seeded=true;save();
}

/* ---------- Stare interfață ---------- */
var view='sell',catFilter='',cart={},cartOpen=false,pay={method:'cash',recv:''};
var editing=null,confirmId=null,histOpen=null,repMode='day',repDay=todayKey(),repMonth=monthKey(Date.now());
var bkArmed=false,toastTimer=null,kpOpen=false,kpv='',freeLines={};

function cats(){
  var set={};S.products.forEach(function(p){if(p.cat)set[p.cat]=1});
  return Object.keys(set).sort(function(a,b){return a.localeCompare(b,'ro')});
}
function cartLines(){
  return Object.keys(cart).map(function(id){
    var p=S.products.find(function(x){return x.id===id})||freeLines[id];
    return p?{id:id,n:p.name,p:p.price,q:cart[id]}:null;
  }).filter(Boolean);
}
var cartTotal=function(){return sum(cartLines(),function(l){return l.p*l.q})};
var cartCount=function(){return sum(cartLines(),function(l){return l.q})};

function toast(msg,ms){
  var t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},ms||2500);
}

/* ---------- Vânzare ---------- */
function vSell(){
  if(!S.products.length){
    return '<section class="empty"><h2>Nu ai produse încă</h2><p>Adaugă primul produs ca să poți vinde.</p><button class="btn primary" data-a="tab" data-v="prod">Adaugă produse</button></section>';
  }
  var cs=cats();if(catFilter&&cs.indexOf(catFilter)<0)catFilter='';
  var list=S.products.filter(function(p){return !catFilter||p.cat===catFilter});
  var chips=cs.length?'<div class="chips" role="group" aria-label="Categorii">'+['']
    .concat(cs).map(function(c){
      return '<button class="chip" aria-pressed="'+(c===catFilter)+'" data-a="cat" data-v="'+esc(c)+'">'+(c?esc(c):'Toate')+'</button>';
    }).join('')+'</div>':'';
  return '<h1 class="h">Vânzare</h1><button class="btn" data-a="kpOpen" style="width:100%;margin-bottom:10px">Sumă liberă (fără produs)</button>'+chips+'<div class="grid">'+list.map(function(p){
    var q=cart[p.id]||0;
    return '<button class="prod" data-a="add" data-id="'+p.id+'"><span class="pn">'+esc(p.name)+'</span><span class="pp">'+money(p.price)+'</span>'+(q?'<span class="badge" aria-label="În coș: '+q+'">'+q+'</span>':'')+'</button>';
  }).join('')+'</div>';
}

/* ---------- Produse ---------- */
function prodForm(){
  var p=editing==='new'?{name:'',price:null,cat:''}:S.products.find(function(x){return x.id===editing});
  if(!p){editing=null;return '';}
  return '<form class="card" data-form="prod"><h2>'+(editing==='new'?'Produs nou':'Editează produsul')+'</h2>'
    +'<label for="fn">Denumire</label><input id="fn" required maxlength="60" autocomplete="off" value="'+esc(p.name)+'">'
    +'<label for="fp">Preț (lei)</label><input id="fp" required inputmode="decimal" autocomplete="off" placeholder="0,00" value="'+(p.price==null?'':plain(p.price))+'">'
    +'<label for="fc">Categorie (opțional)</label><input id="fc" list="catlist" maxlength="30" autocomplete="off" value="'+esc(p.cat||'')+'">'
    +'<datalist id="catlist">'+cats().map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist>'
    +'<div id="ferr" class="err" role="alert"></div>'
    +'<div class="row"><button class="btn primary" type="submit">Salvează</button><button class="btn" type="button" data-a="prodCancel">Anulează</button></div></form>';
}
function vProd(){
  var head=editing?prodForm():'<button class="btn primary" data-a="prodNew">+ Adaugă produs</button>';
  var rows=S.products.slice().sort(function(a,b){return a.name.localeCompare(b.name,'ro')}).map(function(p){
    var c=confirmId===p.id;
    return '<li class="prow"><div><b>'+esc(p.name)+'</b><small>'+(p.cat?esc(p.cat)+' · ':'')+money(p.price)+'</small></div>'
      +'<div class="acts"><button class="btn small" data-a="prodEdit" data-id="'+p.id+'">Editează</button>'
      +'<button class="btn small'+(c?' danger':'')+'" data-a="prodDel" data-id="'+p.id+'">'+(c?'Confirmă':'Șterge')+'</button></div></li>';
  }).join('');
  return '<h1 class="h">Produse</h1>'+head
    +(S.sales.length===0&&S.products.length?'<p class="note">Produsele din listă sunt exemple. Editează-le sau șterge-le și adaugă-le pe ale tale.</p>':'')
    +(rows?'<ul class="plist">'+rows+'</ul>':'<p class="note">Nu ai niciun produs.</p>');
}

/* ---------- Rapoarte ---------- */
function vRep(){
  var isDay=repMode==='day';
  var list=S.sales.filter(function(s){return isDay?dayKey(s.ts)===repDay:monthKey(s.ts)===repMonth});
  var total=sum(list,function(s){return s.total}),cnt=list.length;
  var cash=sum(list.filter(function(s){return s.method==='cash'}),function(s){return s.total}),card=total-cash;
  var label=isDay?fmtDay(repDay):fmtMonth(repMonth);
  var atEnd=isDay?repDay>=todayKey():repMonth>=monthKey(Date.now());
  var sub=isDay?(repDay===todayKey()?'Azi':''):(repMonth===monthKey(Date.now())?'Luna aceasta':'');
  var agg={};
  list.forEach(function(s){s.items.forEach(function(i){var a=agg[i.n]||(agg[i.n]={q:0,t:0});a.q+=i.q;a.t+=i.p*i.q})});
  var top=Object.keys(agg).map(function(k){return [k,agg[k]]}).sort(function(a,b){return b[1].t-a[1].t}).slice(0,10);
  var maxT=top.length?top[0][1].t||1:1;
  var out='<h1 class="h">Rapoarte</h1>'
    +'<div class="seg" role="group" aria-label="Perioadă"><button aria-pressed="'+isDay+'" data-a="repMode" data-v="day">Zilnic</button><button aria-pressed="'+!isDay+'" data-a="repMode" data-v="month">Lunar</button></div>'
    +'<div class="pager"><button class="btn" data-a="repPrev" aria-label="Perioada anterioară">‹</button><div>'+esc(label)+(sub?'<small>'+sub+'</small>':'')+'</div><button class="btn" data-a="repNext" aria-label="Perioada următoare"'+(atEnd?' disabled':'')+'>›</button></div>';
  if(!cnt){return out+'<section class="empty"><h2>Nicio vânzare în această perioadă</h2><p>Încasările apar aici imediat după prima vânzare.</p></section>';}
  out+='<div class="kpi"><div class="card wide"><small>Total încasat</small><strong>'+money(total)+'</strong></div>'
    +'<div class="card"><small>Tranzacții</small><strong>'+cnt+'</strong></div>'
    +'<div class="card"><small>Bon mediu</small><strong>'+money(Math.round(total/cnt))+'</strong></div>'
    +'<div class="card"><small>Numerar</small><strong>'+money(cash)+'</strong></div>'
    +'<div class="card"><small>Card</small><strong>'+money(card)+'</strong></div></div>';
  out+='<div class="card"><h2>Produse vândute</h2><div>'+top.map(function(t){
    return '<div class="brow"><span>'+esc(t[0])+' <em>× '+t[1].q+'</em></span><strong>'+money(t[1].t)+'</strong><div class="bar"><i style="width:'+Math.max(3,Math.round(t[1].t/maxT*100))+'%"></i></div></div>';
  }).join('')+'</div></div>';
  if(!isDay){
    var days={};list.forEach(function(s){var k=dayKey(s.ts);var d=days[k]||(days[k]={n:0,t:0});d.n++;d.t+=s.total});
    var dk=Object.keys(days).sort();var maxD=Math.max.apply(null,dk.map(function(k){return days[k].t}))||1;
    out+='<div class="card"><h2>Pe zile</h2><div>'+dk.map(function(k){
      return '<div class="brow"><span>'+fmtShort(k)+' <em>· '+days[k].n+' tranz.</em></span><strong>'+money(days[k].t)+'</strong><div class="bar"><i style="width:'+Math.max(3,Math.round(days[k].t/maxD*100))+'%"></i></div></div>';
    }).join('')+'</div></div>';
  }
  return out;
}

/* ---------- Istoric ---------- */
function vHist(){
  var out='<h1 class="h">Istoric</h1>';
  if(!S.sales.length){
    out+='<section class="empty"><h2>Nicio tranzacție încă</h2><p>Vânzările încasate apar aici, cele mai noi primele.</p></section>';
  }else{
    var cur='';
    S.sales.slice(0,300).forEach(function(s){
      var k=dayKey(s.ts);
      if(k!==cur){cur=k;out+='<h2 class="day">'+fmtDay(k)+'</h2>';}
      var open=histOpen===s.id,c=confirmId===s.id;
      out+='<article class="sale"><button class="srow" data-a="histToggle" data-id="'+s.id+'" aria-expanded="'+open+'"><span class="t">'+fmtTime(s.ts)+'</span><span>'+sum(s.items,function(i){return i.q})+' art. · '+(s.method==='cash'?'Numerar':'Card')+'</span><strong>'+money(s.total)+'</strong></button>';
      if(open){
        out+='<div class="sdet"><ul>'+s.items.map(function(i){return '<li><span>'+esc(i.n)+' × '+i.q+'</span><span>'+money(i.p*i.q)+'</span></li>'}).join('')+'</ul>'
          +(s.method==='cash'?'<p class="note">Primit '+money(s.paid)+' · Rest '+money(s.change)+'</p>':'')
          +'<button class="btn small'+(c?' danger':'')+'" data-a="histDel" data-id="'+s.id+'">'+(c?'Confirmă ștergerea':'Șterge tranzacția')+'</button></div>';
      }
      out+='</article>';
    });
    if(S.sales.length>300)out+='<p class="note">Se afișează ultimele 300 de tranzacții. Rapoartele le includ pe toate.</p>';
  }
  out+='<section class="card"><h2>Copie de siguranță</h2><p class="note">Datele sunt salvate doar pe acest telefon, în acest browser. Copiază-le din când în când într-o notiță.</p>'
    +'<div class="row" style="margin-top:0"><button class="btn" data-a="bkMake">Pregătește copia</button></div>'
    +'<textarea id="bk" rows="4" readonly hidden aria-label="Copie de siguranță"></textarea>'
    +'<label for="bkIn">Restaurare: lipește aici o copie</label><textarea id="bkIn" rows="3" placeholder="Lipește datele copiate"></textarea>'
    +'<div class="row"><button id="bkRestore" class="btn" data-a="bkRestore">Restaurează</button></div><div id="bkmsg" class="note" role="status"></div></section>';
  return out;
}

/* ---------- Coș și plată ---------- */
function updateRest(){
  var btn=$('#paybtn');if(!btn)return;
  if(pay.method==='card'){btn.disabled=false;return;}
  var box=$('#rest'),total=cartTotal(),r=pay.recv.trim();
  var recv=r===''?total:parseMoney(r);
  if(recv===null){box.className='rest bad';box.innerHTML='<span>Sumă invalidă</span><strong>—</strong>';btn.disabled=true;return;}
  var d=recv-total;
  if(d>=0){box.className='rest ok';box.innerHTML='<span>Rest de dat</span><strong>'+money(d)+'</strong>';btn.disabled=false;}
  else{box.className='rest bad';box.innerHTML='<span>Mai lipsesc</span><strong>'+money(-d)+'</strong>';btn.disabled=true;}
}
function renderSheet(){
  var sh=$('#sheet');
  var lines=cartLines();
  if(cartOpen&&!lines.length)cartOpen=false;
  if(!cartOpen){sh.hidden=true;sh.innerHTML='';document.body.classList.remove('lock');return;}
  var total=cartTotal();
  sh.hidden=false;document.body.classList.add('lock');
  sh.innerHTML='<div class="sheet-in">'
    +'<div class="sh-head"><button class="btn ghost" data-a="closeCart">← Înapoi</button><h2>Coș</h2><button class="btn ghost" data-a="clearCart">Golește</button></div>'
    +'<ul class="lines">'+lines.map(function(l){
      return '<li><div class="ln"><span>'+esc(l.n)+'</span><small>'+money(l.p)+' × '+l.q+'</small></div>'
        +'<div class="qty"><button class="rb" aria-label="Mai puțin: '+esc(l.n)+'" data-a="dec" data-id="'+l.id+'">−</button><b>'+l.q+'</b><button class="rb" aria-label="Mai mult: '+esc(l.n)+'" data-a="inc" data-id="'+l.id+'">+</button></div>'
        +'<strong class="lt">'+money(l.p*l.q)+'</strong></li>';
    }).join('')+'</ul>'
    +'<div class="total"><span>Total de plată</span><strong>'+money(total)+'</strong></div>'
    +'<div class="seg" role="group" aria-label="Metodă de plată"><button aria-pressed="'+(pay.method==='cash')+'" data-a="method" data-v="cash">Numerar</button><button aria-pressed="'+(pay.method==='card')+'" data-a="method" data-v="card">Card</button></div>'
    +(pay.method==='cash'
      ?'<label for="recv">Sumă primită (lei)</label><input id="recv" inputmode="decimal" autocomplete="off" placeholder="'+plain(total)+'" value="'+esc(pay.recv)+'">'
        +'<div class="chips quick"><button class="chip" data-a="quick" data-v="exact">Exact</button>'
        +[10,20,50,100,200,500].map(function(v){return '<button class="chip" data-a="quick" data-v="'+v+'">'+v+'</button>'}).join('')+'</div>'
        +'<div id="rest" class="rest"></div>'
      :'')
    +'<button id="paybtn" class="btn primary big" data-a="pay">Încasează '+money(total)+'</button></div>';
  updateRest();
}
function doPay(){
  var lines=cartLines();if(!lines.length)return;
  var total=cartTotal(),paid=total,change=0,method=pay.method;
  if(method==='cash'){
    var r=pay.recv.trim();paid=r===''?total:parseMoney(r);
    if(paid===null||paid<total)return;
    change=paid-total;
  }
  S.sales.unshift({id:uid(),ts:Date.now(),items:lines.map(function(l){return {n:l.n,p:l.p,q:l.q}}),total:total,method:method,paid:paid,change:change});
  save();cart={};pay.recv='';cartOpen=false;
  toast(method==='cash'&&change>0?'Încasat '+money(total)+'. Rest de dat: '+money(change):'Încasat '+money(total),change>0?7000:2500);
  render();
}

function renderKp(){
  var el=$('#kp');
  if(!kpOpen){el.hidden=true;el.innerHTML='';return;}
  var a=parseMoney(kpv||'0'),ok=a!==null&&a>0;
  var keys=['1','2','3','4','5','6','7','8','9',',','0','⌫'];
  el.hidden=false;
  el.innerHTML='<div class="sheet-in"><div class="sh-head"><button class="btn ghost" data-a="kpClose">← Înapoi</button><h2>Sumă liberă</h2><span></span></div>'
    +'<div class="kpdisp" aria-live="polite">'+(kpv===''?'0':esc(kpv))+' <small>lei</small></div>'
    +'<div class="keys">'+keys.map(function(k){return '<button class="key" data-a="kpKey" data-v="'+k+'"'+(k==='⌫'?' aria-label="Șterge"':'')+'>'+k+'</button>'}).join('')+'</div>'
    +'<div class="row kpacts"><button class="btn primary big" data-a="kpCash"'+(ok?'':' disabled')+'>Numerar</button><button class="btn big kpcard" data-a="kpCard"'+(ok?'':' disabled')+'>Card</button></div></div>';
}

/* ---------- Randare ---------- */
function renderDock(){
  var n=cartCount(),bar=$('#cartbar');
  if(view==='sell'&&n>0){
    bar.hidden=false;
    bar.innerHTML='<div class="cartrow"><button class="cartbtn" data-a="openCart"><span>Coș · '+n+'</span><strong>'+money(cartTotal())+'</strong><span class="go">Numerar →</span></button><button class="quickcard" data-a="payCard" aria-label="Încasează '+money(cartTotal())+' cu cardul">Card</button></div>';
  }else{bar.hidden=true;bar.innerHTML='';}
  document.querySelectorAll('.tab').forEach(function(t){
    if(t.dataset.v===view)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');
  });
}
function render(){
  $('#main').innerHTML=view==='sell'?vSell():view==='prod'?vProd():view==='rep'?vRep():vHist();
  renderDock();renderSheet();renderKp();
}

/* ---------- Acțiuni ---------- */
function act(a,d){
  if(a!=='prodDel'&&a!=='histDel')confirmId=null;
  switch(a){
    case 'tab':view=d.v;editing=null;histOpen=null;window.scrollTo(0,0);render();break;
    case 'cat':catFilter=d.v;render();break;
    case 'add':cart[d.id]=(cart[d.id]||0)+1;render();break;
    case 'inc':cart[d.id]=(cart[d.id]||0)+1;render();break;
    case 'dec':cart[d.id]=(cart[d.id]||0)-1;if(cart[d.id]<=0)delete cart[d.id];render();break;
    case 'openCart':cartOpen=true;render();break;
    case 'closeCart':cartOpen=false;render();break;
    case 'clearCart':cart={};cartOpen=false;pay.recv='';render();break;
    case 'method':pay.method=d.v;render();break;
    case 'quick':
      pay.recv=d.v==='exact'?plain(cartTotal()):String(d.v);
      var rin=$('#recv');if(rin)rin.value=pay.recv;
      updateRest();break;
    case 'pay':doPay();break;
    case 'payCard':pay.method='card';doPay();pay.method='cash';break;
    case 'kpOpen':kpOpen=true;kpv='';renderKp();break;
    case 'kpClose':kpOpen=false;renderKp();break;
    case 'kpKey':
      if(d.v==='⌫')kpv=kpv.slice(0,-1);
      else if(d.v===','){if(kpv.indexOf(',')<0)kpv=(kpv===''?'0':kpv)+',';}
      else{
        if(kpv==='0')kpv='';
        var dec=kpv.split(',')[1];
        if((dec===undefined||dec.length<2)&&kpv.replace(',','').length<8)kpv+=d.v;
      }
      renderKp();break;
    case 'kpCash':case 'kpCard':
      var amt=parseMoney(kpv||'0');
      if(amt===null||amt<=0)break;
      var fid='free:'+uid();freeLines[fid]={name:'Sumă liberă',price:amt};cart[fid]=1;
      kpOpen=false;kpv='';
      if(a==='kpCash'){cartOpen=true;render();}
      else{pay.method='card';doPay();pay.method='cash';}
      break;
    case 'prodNew':editing='new';render();break;
    case 'prodEdit':editing=d.id;render();break;
    case 'prodCancel':editing=null;render();break;
    case 'prodDel':
      if(confirmId===d.id){
        S.products=S.products.filter(function(p){return p.id!==d.id});
        delete cart[d.id];confirmId=null;save();toast('Produs șters');
      }else confirmId=d.id;
      render();break;
    case 'repMode':repMode=d.v;render();break;
    case 'repPrev':if(repMode==='day')repDay=shiftDay(repDay,-1);else repMonth=shiftMonth(repMonth,-1);render();break;
    case 'repNext':
      if(repMode==='day'){if(repDay<todayKey())repDay=shiftDay(repDay,1);}
      else if(repMonth<monthKey(Date.now()))repMonth=shiftMonth(repMonth,1);
      render();break;
    case 'histToggle':histOpen=histOpen===d.id?null:d.id;render();break;
    case 'histDel':
      if(confirmId===d.id){
        S.sales=S.sales.filter(function(s){return s.id!==d.id});
        confirmId=null;histOpen=null;save();toast('Tranzacție ștearsă');
      }else confirmId=d.id;
      render();break;
    case 'bkMake':
      var ta=$('#bk'),txt=JSON.stringify(S);
      ta.hidden=false;ta.value=txt;ta.focus();ta.select();
      var msg=$('#bkmsg');
      try{
        navigator.clipboard.writeText(txt).then(
          function(){msg.textContent='Copiat. Lipește-l într-o notiță sau într-un mesaj către tine.'},
          function(){msg.textContent='Textul e selectat. Copiază-l manual.'}
        );
      }catch(e){msg.textContent='Textul e selectat. Copiază-l manual.';}
      break;
    case 'bkRestore':
      var m=$('#bkmsg'),inp=$('#bkIn').value.trim(),o;
      try{o=JSON.parse(inp)}catch(e){o=null}
      if(!o||!Array.isArray(o.products)||!Array.isArray(o.sales)){m.textContent='Copia nu este validă. Lipește tot textul copiat.';bkArmed=false;break;}
      if(!bkArmed){bkArmed=true;m.textContent='Datele curente vor fi înlocuite. Apasă încă o dată Restaurează.';break;}
      S=o;S.seeded=true;save();bkArmed=false;cart={};toast('Date restaurate');render();break;
  }
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');
  if(el)act(el.dataset.a,el.dataset);
});
document.addEventListener('input',function(e){
  if(e.target.id==='recv'){pay.recv=e.target.value;updateRest();}
  else if(e.target.id==='bkIn'){bkArmed=false;}
});
document.addEventListener('submit',function(e){
  if(e.target.dataset.form!=='prod')return;
  e.preventDefault();
  var name=$('#fn').value.trim(),price=parseMoney($('#fp').value),cat=$('#fc').value.trim(),err=$('#ferr');
  if(!name){err.textContent='Scrie denumirea produsului.';return;}
  if(price===null){err.textContent='Scrie prețul ca număr, de exemplu 12,50.';return;}
  if(editing==='new'){S.products.push({id:uid(),name:name,price:price,cat:cat});}
  else{
    var p=S.products.find(function(x){return x.id===editing});
    if(p){p.name=name;p.price=price;p.cat=cat;}
  }
  save();editing=null;toast('Produs salvat');render();
});
render();
})();
</script>

</html>
